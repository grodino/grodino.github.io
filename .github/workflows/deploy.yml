name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BAUDELAIRE_VERSION: v0.0.18

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: restore baudelaire binary
        id: bin-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/baudelaire
          key: baudelaire-bin-${{ runner.os }}-${{ env.BAUDELAIRE_VERSION }}

      - name: install baudelaire
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.96 --profile minimal
          cargo +1.96 install --locked --git https://github.com/cestef/baudelaire --tag "$BAUDELAIRE_VERSION" baudelaire

      - name: restore build cache
        uses: actions/cache@v6
        with:
          path: .baudelaire
          key: baudelaire-${{ hashFiles('content/**', 'assets/**', 'config.kdl') }}
          restore-keys: baudelaire-

      - run: baudelaire build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v5