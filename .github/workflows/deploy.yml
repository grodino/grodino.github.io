name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BAUDELAIRE_VERSION: v0.0.18
  PAGES_BRANCH: gh-pages
  PAGES_DOMAIN: godinot.xyz

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: restore baudelaire binary
        id: bin-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/baudelaire
          key: baudelaire-bin-${{ runner.os }}-${{ env.BAUDELAIRE_VERSION }}

      - name: install baudelaire
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.96 --profile minimal
          cargo +1.96 install --locked --git https://github.com/cestef/baudelaire --tag "$BAUDELAIRE_VERSION" baudelaire

      - name: restore build cache
        uses: actions/cache@v6
        with:
          path: .baudelaire
          key: baudelaire-${{ hashFiles('content/**', 'assets/**', 'config.kdl') }}
          restore-keys: baudelaire-

      - run: baudelaire build

      # Publish `public/` as a single orphan commit on the pages branch. CNAME
      # keeps the custom domain (a branch deploy reads it from the branch), and
      # .nojekyll stops GitHub from running the output through Jekyll.
      - name: push to ${{ env.PAGES_BRANCH }}
        working-directory: public
        run: |
          echo "$PAGES_DOMAIN" > CNAME
          touch .nojekyll
          git init -q -b "$PAGES_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$PAGES_BRANCH"
